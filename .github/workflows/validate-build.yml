name: Validate site build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Verify personal content on both pages
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          for title in "SynLogic" "Perception Bottleneck" "Universal Truthfulness Hyperplane" "In-Context Sharpness" "C-Eval" "Composing Parameter-Efficient Modules"; do
            grep -q "$title" _site/index.html
            grep -q "$title" _site/publications/index.html
            echo "Found publication on both pages: $title"
          done
          for detail in "Junteng Liu" "HKUST NLP Group" "Shanghai Jiao Tong University" "MINIMAX" "Tencent WXG" "Shanghai AI Lab" "Zhiyuan Honor Scholarship" "jliugi@connect.ust.hk" "Vicent0205" "junteng88716710"; do
            grep -q "$detail" _site/index.html
            echo "Found personal detail: $detail"
          done
          if grep -Eq "Paper Title Number|Your Name|GitHub University|Red Brick University|Academic Pages is a ready-to-fork" _site/index.html _site/publications/index.html; then
            echo "Template placeholder content found"
            exit 1
          fi
      - name: Show rendered content
        run: |
          python3 - <<'PY'
          import re
          html = open('_site/publications/index.html', encoding='utf-8').read()
          body = html.split('<div id="main"', 1)[1]
          start = body.find('archive__item-title')
          print(body[start - 100:start + 5000])
          print('\n=== About page text ===')
          about = open('_site/index.html', encoding='utf-8').read()
          about = about.split('<div id="main"', 1)[1]
          text = re.sub(r'<[^>]+>', ' ', about)
          print(re.sub(r'[ \t]+', ' ', text).strip())
          PY
      - name: List generated HTML pages
        run: find _site -name "*.html" | sort
